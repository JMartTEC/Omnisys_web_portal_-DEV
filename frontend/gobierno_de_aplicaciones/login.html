<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Portal APM TEC</title>
<style>
  :root { --azul:#1b3068; --azul2:#3b63d6; --gris:#5b6b82; --borde:#d8e0ec; --rojo:#c00e14; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         font-family:"Poppins","Segoe UI",system-ui,sans-serif; color:#2a3850;
         background:linear-gradient(135deg,#eef2fb 0%,#f8f9fd 100%); padding:24px; }
  .tarjeta { width:100%; max-width:420px; background:#fff; border:1px solid var(--borde); border-radius:16px;
             box-shadow:0 10px 30px rgba(27,48,104,.10); padding:32px 28px; }
  .marca-titulo { font-weight:700; font-size:22px; color:var(--azul); }
  .marca-sub { display:block; font-size:13px; color:var(--gris); margin:2px 0 22px; }
  h1 { font-size:17px; margin:0 0 6px; color:var(--azul); }
  p.ayuda { font-size:13px; color:var(--gris); margin:0 0 16px; line-height:1.45; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--borde); border-radius:10px; }
  input:focus { outline:2px solid var(--azul2); border-color:var(--azul2); }
  button { width:100%; margin-top:22px; padding:12px; font-size:15px; font-weight:600; color:#fff; cursor:pointer;
           background:linear-gradient(90deg,var(--azul),var(--azul2)); border:0; border-radius:10px; }
  button:disabled { opacity:.6; cursor:wait; }
  .error { min-height:20px; margin-top:14px; font-size:13px; color:var(--rojo); }
  [hidden] { display:none !important; }
  .pie { margin-top:18px; font-size:12px; color:var(--gris); }
</style>
</head>
<body>
<main class="tarjeta">
  <span class="marca-titulo">Portal APM TEC</span>
  <span class="marca-sub">Gobierno de Aplicaciones VPAF</span>

  <form id="form-login" autocomplete="on">
    <h1>Iniciar sesión</h1>
    <p class="ayuda">Entra con tu correo institucional y tu contraseña.</p>
    <label for="usuario">Correo</label>
    <input id="usuario" name="username" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>

  <form id="form-cambio" autocomplete="off" hidden>
    <h1>Cambia tu contraseña</h1>
    <p class="ayuda">Tu contraseña es temporal. Elige una nueva: mínimo 12 caracteres, con mayúscula, minúscula y número.</p>
    <label for="actual">Contraseña actual (la temporal)</label>
    <input id="actual" type="password" autocomplete="current-password" required>
    <label for="nueva">Contraseña nueva</label>
    <input id="nueva" type="password" autocomplete="new-password" minlength="12" required>
    <label for="repetir">Repite la contraseña nueva</label>
    <input id="repetir" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Guardar y entrar</button>
  </form>

  <div class="error" id="error" role="alert"></div>
</main>
<div class="pie">© 2026 Tecnológico de Monterrey</div>
<script src="/gobierno_de_aplicaciones/assets/js/pages/login.js"></script>
</body>
</html>
